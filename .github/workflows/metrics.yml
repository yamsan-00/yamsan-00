name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/general.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: header, activity, community, repositories, metadata
          base_indepth: true
          base_hireable: no
          base_skip: archived
          config_timezone: Asia/Kolkata
          config_padding: 15
          config_animations: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_introduction: yes
          plugin_introduction_title: no
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_repositories: yes
          plugin_repositories_featured: >
            yamsan-00/cnn_from_scratch,
            yamsan-00/3_body_problem,
            yamsan-00/agent_007,
            yamsan-00/hopcroft-karp-algorithm,
            yamsan-00/sgd_visul,
            yamsan-00/learning_machine_learning
          extras_css: |
            svg {
              background: #0d0d1a;
              color: #d1d1e0;
            }
            h1, h2, h3 {
              color: #FF2A6D !important;
            }
            .field {
              color: #d1d1e0;
            }
            .field svg {
              fill: #05D9E8;
            }
            a {
              color: #05D9E8 !important;
            }
            .avatar {
              border-color: #FF2A6D;
            }
            .chart-bars .entry {
              color: #8b8ba7;
            }
            .chart-bars .bar {
              background-color: #FF2A6D;
              border-color: #FF2A6D;
            }
            .calendar .day {
              fill: #1a1a2e;
            }
          extras_js: |
            for (const {a, b} of [
              {a:"#216e39", b:"#00FF9F"},
              {a:"#30a14e", b:"#05D9E8"},
              {a:"#40c463", b:"#FF2A6D"},
              {a:"#9be9a8", b:"#FFC100"},
              {a:"#ebedf0", b:"#1a1a2e"},
            ])
            document.querySelectorAll(`svg g [fill="${a}"]`).forEach(node => node.setAttribute("fill", b))

      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage, bytes-size, lines
          config_padding: 15
          config_animations: yes
          extras_css: |
            svg {
              background: #0d0d1a;
              color: #d1d1e0;
            }
            h1, h2, h3 {
              color: #FF2A6D !important;
            }
            .field {
              color: #d1d1e0;
            }
            .field svg {
              fill: #05D9E8;
            }
            a {
              color: #05D9E8 !important;
            }
            .chart-bars .bar {
              background-color: #05D9E8;
              border-color: #05D9E8;
            }

      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/habits.svg
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          base: ""
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes
          config_padding: 15
          config_animations: yes
          extras_css: |
            svg {
              background: #0d0d1a;
              color: #d1d1e0;
            }
            h1, h2, h3 {
              color: #FF2A6D !important;
            }
            .field {
              color: #d1d1e0;
            }
            .field svg {
              fill: #05D9E8;
            }
            a {
              color: #05D9E8 !important;
            }
            .chart-bars .entry {
              color: #8b8ba7;
            }
            .chart-bars .bar {
              background-color: #FF2A6D;
              border-color: #FF2A6D;
            }
