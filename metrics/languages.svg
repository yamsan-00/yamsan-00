<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10101f"/>
      <stop offset="100%" stop-color="#0a0a16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05D9E8"/>
      <stop offset="100%" stop-color="#FF2A6D"/>
    </linearGradient>
  </defs>

  <rect width="780" height="560" fill="url(#bg)"/>
  <circle cx="716" cy="46" r="70" fill="none" stroke="#1c1c34" stroke-width="1.5" opacity="0.6"/>
  <circle cx="752" cy="82" r="16" fill="#05D9E8" opacity="0.25"/>

  <text x="60" y="54" font-size="20" font-weight="700" fill="#FF2A6D">LANGUAGES</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="60" y="96" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">PROGRAMMING LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="124" r="5" fill="#FFC100"/>
    <text x="84" y="129" fill="#d1d1e0">Python</text>
    <rect x="260" y="120" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="120" width="270" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="129" font-size="12" fill="#8b8ba7">90%</text>

    <circle cx="66" cy="152" r="5" fill="#05D9E8"/>
    <text x="84" y="157" fill="#d1d1e0">C++</text>
    <rect x="260" y="148" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="148" width="225" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="157" font-size="12" fill="#8b8ba7">75%</text>

    <circle cx="66" cy="180" r="5" fill="#FF2A6D"/>
    <text x="84" y="185" fill="#d1d1e0">C</text>
    <rect x="260" y="176" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="176" width="210" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="185" font-size="12" fill="#8b8ba7">70%</text>
  </g>

  <text x="60" y="222" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">SCRIPTING LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="248" r="5" fill="#8b8ba7"/>
    <text x="84" y="253" fill="#d1d1e0">Bash</text>
    <rect x="260" y="244" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="244" width="195" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="253" font-size="12" fill="#8b8ba7">65%</text>
  </g>

  <text x="60" y="292" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">MARKUP LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="318" r="5" fill="#05D9E8"/>
    <text x="84" y="323" fill="#d1d1e0">LaTeX</text>
    <rect x="260" y="314" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="314" width="180" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="323" font-size="12" fill="#8b8ba7">60%</text>

    <circle cx="66" cy="346" r="5" fill="#FFC100"/>
    <text x="84" y="351" fill="#d1d1e0">Markdown</text>
    <rect x="260" y="342" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="342" width="225" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="351" font-size="12" fill="#8b8ba7">75%</text>
  </g>

  <text x="60" y="380" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">QUERY LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="406" r="5" fill="#FF2A6D"/>
    <text x="84" y="411" fill="#d1d1e0">SQL</text>
    <rect x="260" y="402" width="300" height="8" rx="4" fill="#1f1f33"/>
    <rect x="260" y="402" width="180" height="8" rx="4" fill="url(#accent)"/>
    <text x="580" y="411" font-size="12" fill="#8b8ba7">60%</text>
  </g>

  <rect x="80" y="480" width="620" height="64" rx="12" fill="#121222" stroke="#2a2a4a" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="390" y="511" text-anchor="middle" font-size="12" letter-spacing="3" fill="#4a4a66">GIF PLACEHOLDER</text>
  <text x="390" y="530" text-anchor="middle" font-size="10" letter-spacing="1" fill="#3a3a55">480 x 270</text>
</svg>
