<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="620" viewBox="0 0 780 620" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1010"/>
      <stop offset="100%" stop-color="#0e090a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF3131"/>
    </linearGradient>
  </defs>

  <rect width="780" height="620" fill="url(#bg)"/>
  <circle cx="716" cy="46" r="70" fill="none" stroke="#33201e" stroke-width="1.5" opacity="0.6"/>
  <circle cx="752" cy="82" r="16" fill="#FFB300" opacity="0.25"/>

  <text x="60" y="54" font-size="20" font-weight="700" fill="#FF3131">LANGUAGES</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="104" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">PROGRAMMING LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="132" r="5" fill="#FFB300">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text x="84" y="137" fill="#d1d1e0">Python</text>

    <circle cx="66" cy="160" r="5" fill="#FF7A00"/>
    <text x="84" y="165" fill="#d1d1e0">C++</text>

    <circle cx="66" cy="188" r="5" fill="#FF3131"/>
    <text x="84" y="193" fill="#d1d1e0">C</text>
  </g>

  <text x="60" y="232" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">MARKUP LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="260" r="5" fill="#FF7A00"/>
    <text x="84" y="265" fill="#d1d1e0">LaTeX</text>

    <circle cx="66" cy="288" r="5" fill="#FFB300"/>
    <text x="84" y="293" fill="#d1d1e0">Markdown</text>
  </g>

  <text x="60" y="332" font-size="11.5" font-weight="700" letter-spacing="2.5" fill="#8b8ba7">QUERY LANGUAGES</text>

  <g font-size="14">
    <circle cx="66" cy="360" r="5" fill="#FF3131"/>
    <text x="84" y="365" fill="#d1d1e0">SQL</text>
  </g>

  <image x="80" y="492" width="620" height="112" preserveAspectRatio="xMidYMid slice" href="https://media.giphy.com/media/EBDaEEbwF5KIjbYjLS/giphy.gif"/>
</svg>
